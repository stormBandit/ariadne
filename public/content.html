<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ariadne — content</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page">
    <a class="back-link" href="/">&larr; Back to dashboard</a>
    <header class="top">
      <h1 id="title">Loading...</h1>
      <span id="status-badge" class="badge draft">draft</span>
    </header>
    <div style="display: flex; gap: 6px; margin-bottom: 16px;">
      <a id="studio-link" href="#" target="_blank" rel="noopener" class="button small secondary" style="display: none;">Go To Studio ↗</a>
      <a id="watch-link" href="#" target="_blank" rel="noopener" class="button small secondary" style="display: none;">Go To Watch ↗</a>
    </div>

    <div class="section">
      <h2>Keywords Targetted</h2>
      <div id="keyword-list"></div>
      <form id="add-keyword-form" style="display: flex; gap: 6px; margin-top: 8px;">
        <input id="keyword-text" type="text" placeholder="Keyword" required style="flex: 1;" />
        <input id="keyword-score" type="number" min="0" max="100" placeholder="Score (0-100)" style="width: 140px;" />
        <select id="keyword-volume">
          <option value="">Search volume</option>
          <option value="Poor">Poor</option>
          <option value="Fair">Fair</option>
          <option value="Good">Good</option>
          <option value="Great">Great</option>
          <option value="Excellent">Excellent</option>
        </select>
        <button type="submit" class="small">Add</button>
      </form>
    </div>

    <div class="section">
      <h2>Links</h2>
      <div id="link-list"></div>
      <div style="margin-top: 16px;">
        <button type="button" id="generate-openinapp-link" class="small secondary">Generate OpenInApp Link</button>
        <span id="generate-openinapp-status"></span>
      </div>
      <form id="add-link-form" style="display: flex; gap: 6px; margin-top: 16px;">
        <select id="link-type" required>
          <option value="openinapp">OpenInApp</option>
          <option value="creatorurls">CreatorURLs</option>
          <option value="affiliate">Affiliate</option>
          <option value="other">Other</option>
        </select>
        <input id="link-label" type="text" placeholder="Description (optional)" />
        <input id="link-url" type="url" placeholder="https://..." required style="flex: 1;" />
        <button type="submit" class="small">Add</button>
      </form>
      <div id="link-form-status" class="error-text"></div>
    </div>

    <div class="section">
      <h2>Messages</h2>
      <div id="message-list"></div>
      <form id="add-message-form" style="display: flex; flex-direction: column; gap: 6px; margin-top: 8px;">
        <div style="display: flex; gap: 6px;">
          <input id="message-platform" type="text" placeholder="Platform (youtube...)" />
          <input id="message-trigger" type="text" placeholder="Trigger word" />
        </div>
        <textarea id="message-body" placeholder="Message body" required rows="3"></textarea>
        <button type="submit" class="small" style="align-self: flex-start;">Add</button>
      </form>
    </div>

    <div class="section">
      <h2>Title Testing</h2>
      <div id="title-test-list"></div>
      <form id="add-title-test-form" class="test-form" style="margin-top: 16px;">
        <div id="title-test-variants" class="variant-rows"></div>
        <button type="button" id="title-test-add-variant" class="small secondary" style="align-self: flex-start;">+ Add variant</button>
        <div style="display: flex; gap: 6px;">
          <input id="title-test-start" type="date" title="Start date (optional)" />
          <input id="title-test-end" type="date" title="End date (optional)" />
          <select id="title-test-status">
            <option value="conclusive">Conclusive</option>
            <option value="inconclusive" selected>Inconclusive (not enough impressions)</option>
          </select>
        </div>
        <textarea id="title-test-notes" placeholder="Notes" rows="2"></textarea>
        <div>
          <button type="submit" class="small">Add Title Test</button>
          <span id="title-test-form-status" class="error-text"></span>
        </div>
      </form>
    </div>

    <div class="section">
      <h2>Thumbnail Testing</h2>
      <div id="thumbnail-test-list"></div>
      <form id="add-thumbnail-test-form" class="test-form" style="margin-top: 16px;">
        <div id="thumbnail-test-variants" class="variant-rows"></div>
        <button type="button" id="thumbnail-test-add-variant" class="small secondary" style="align-self: flex-start;">+ Add variant</button>
        <div style="display: flex; gap: 6px;">
          <input id="thumbnail-test-start" type="date" title="Start date (optional)" />
          <input id="thumbnail-test-end" type="date" title="End date (optional)" />
          <select id="thumbnail-test-status">
            <option value="conclusive">Conclusive</option>
            <option value="inconclusive" selected>Inconclusive (not enough impressions)</option>
          </select>
        </div>
        <textarea id="thumbnail-test-notes" placeholder="Notes" rows="2"></textarea>
        <div>
          <button type="submit" class="small">Add Thumbnail Test</button>
          <span id="thumbnail-test-form-status" class="error-text"></span>
        </div>
      </form>
    </div>

  </div>

  <div id="confirm-modal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <p id="confirm-modal-message">Are you sure?</p>
      <div class="modal-actions">
        <button type="button" id="confirm-modal-cancel" class="small secondary">Cancel</button>
        <button type="button" id="confirm-modal-confirm" class="small danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>initContentDetail();</script>
</body>
</html>
